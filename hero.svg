<svg width="900" height="380" viewBox="0 0 900 380" xmlns="http://www.w3.org/2000/svg">
<defs>
<style>
  .kicker { font-family: 'JetBrains Mono','Fira Code',ui-monospace,monospace; font-weight: 600; font-size: 11px; letter-spacing: 4px; fill: #7c3aed; }
  .name { font-family: 'Segoe UI', Arial, sans-serif; font-weight: 800; font-size: 52px; letter-spacing: 7px; fill: #f4f1fa; }
  .name-shadow { font-family: 'Segoe UI', Arial, sans-serif; font-weight: 800; font-size: 52px; letter-spacing: 7px; fill: #4c1d95; }
  .sub { font-family: 'Segoe UI', Arial, sans-serif; font-weight: 600; font-size: 15px; letter-spacing: 2px; fill: #a78bfa; }
  .role { font-family: 'JetBrains Mono','Fira Code',ui-monospace,monospace; font-weight: 600; font-size: 14px; fill: #ddd6fe; }
  .status-text { font-family: 'JetBrains Mono',ui-monospace,monospace; font-weight: 700; font-size: 13px; letter-spacing: 2px; fill: #ede9fe; }
  .idx { font-family: 'JetBrains Mono',monospace; font-size: 11px; fill: #6d28d9; letter-spacing: 2px; }

  @keyframes tickpulse { 0%, 100% { opacity: .9; } 50% { opacity: .35; } }
  .tick { animation: tickpulse 3.4s ease-in-out infinite; }

  .clip1 rect { animation: type1 9s infinite; }
  .clip2 rect { animation: type2 9s infinite; }
  .clip3 rect { animation: type3 9s infinite; }
  @keyframes type1 { 0%{width:0} 2%{width:0} 10%{width:150px} 28%{width:150px} 32%{width:0} 100%{width:0} }
  @keyframes type2 { 0%{width:0} 34%{width:0} 38%{width:0} 46%{width:230px} 62%{width:230px} 66%{width:0} 100%{width:0} }
  @keyframes type3 { 0%{width:0} 68%{width:0} 71%{width:0} 79%{width:300px} 96%{width:300px} 100%{width:0} }

  @keyframes cursorblink { 0%, 45% { opacity: 1; } 50%, 100% { opacity: 0; } }
  .cursor { animation: cursorblink 1s steps(1) infinite; }
</style>

<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#170d31"/>
  <stop offset="55%" stop-color="#0a0618"/>
  <stop offset="100%" stop-color="#050308"/>
</linearGradient>

<linearGradient id="railGrad" x1="0%" y1="0%" x2="0%" y2="100%">
  <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0"/>
  <stop offset="15%" stop-color="#8b5cf6" stop-opacity="0.9"/>
  <stop offset="85%" stop-color="#6d28d9" stop-opacity="0.9"/>
  <stop offset="100%" stop-color="#6d28d9" stop-opacity="0"/>
</linearGradient>
</defs>

<rect x="0" y="0" width="900" height="380" rx="14" fill="url(#bg)"/>
<rect x="0.75" y="0.75" width="898.5" height="378.5" rx="13" fill="none" stroke="#4c1d95" stroke-width="1.5" opacity="0.55"/>
<rect x="0" y="0" width="900" height="3" fill="#7c3aed" opacity="0.85"/>

<!-- left signature rail, replaces corner brackets -->
<rect x="0" y="30" width="3" height="320" fill="url(#railGrad)"/>
<g class="tick" stroke="#7c3aed" stroke-width="2">
  <line x1="0" y1="60" x2="14" y2="60"/>
  <line x1="0" y1="150" x2="14" y2="150"/>
  <line x1="0" y1="230" x2="14" y2="230"/>
  <line x1="0" y1="320" x2="14" y2="320"/>
</g>

<text x="72" y="46" class="kicker">FYNIXOR STUDIO — CIREBON, ID</text>
<text x="828" y="46" text-anchor="end" class="idx">01 / 03</text>

<text x="453" y="150" text-anchor="middle" class="name-shadow">YOKOTO SAIBA</text>
<text x="450" y="147" text-anchor="middle" class="name">YOKOTO SAIBA</text>

<text x="450" y="184" text-anchor="middle" class="sub">FOUNDER — FYNIXOR STUDIO</text>
<rect x="392" y="200" width="116" height="2" fill="#7c3aed" opacity="0.8"/>

<clipPath id="clip1"><rect x="330" y="228" width="0" height="26"/></clipPath>
<clipPath id="clip2"><rect x="330" y="228" width="0" height="26"/></clipPath>
<clipPath id="clip3"><rect x="330" y="228" width="0" height="26"/></clipPath>

<g class="clip1"><text x="330" y="248" text-anchor="start" class="role" clip-path="url(#clip1)">$ web &amp; bot development</text></g>
<g class="clip2"><text x="330" y="248" text-anchor="start" class="role" clip-path="url(#clip2)">$ cybersecurity &amp; pentesting</text></g>
<g class="clip3"><text x="330" y="248" text-anchor="start" class="role" clip-path="url(#clip3)">$ XAUUSD algorithmic trading</text></g>
<rect class="cursor" x="330" y="230" width="9" height="20" fill="#a78bfa"/>

<g>
<rect x="350" y="288" width="200" height="40" rx="4" fill="#170f28" stroke="#7c3aed" stroke-width="1.3"/>
<rect x="350" y="288" width="4" height="40" fill="#22c55e"/>
<text x="458" y="313" text-anchor="middle" class="status-text">AVAILABLE FOR WORK</text>
</g>
</svg>
