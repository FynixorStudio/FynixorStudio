<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Fynixor Studio">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#170d31"/>
      <stop offset="60%" stop-color="#0a0618"/>
      <stop offset="100%" stop-color="#050308"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6d28d9" stop-opacity="0"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0"/>
    </linearGradient>
    <style>
      .mono { font-family: 'JetBrains Mono','Fira Code',ui-monospace,Consolas,monospace; }
      .sans { font-family: 'Segoe UI',Helvetica,Arial,sans-serif; }
      .kicker { font-size: 11px; letter-spacing: 4px; fill: #7c3aed; font-weight: 600; }
      .name { font-size: 48px; letter-spacing: 7px; fill: #f4f1fa; font-weight: 800; }
      .sub { font-size: 13px; letter-spacing: 3px; fill: #a78bfa; font-weight: 600; }
      .unit { font-size: 14px; fill: #ede9fe; font-weight: 700; letter-spacing: 1px; }
      .state { font-size: 10px; letter-spacing: 2px; fill: #8b7fb0; font-weight: 600; }
      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
      .live { animation: pulse 2.4s ease-in-out infinite; }
    </style>
  </defs>

  <rect width="900" height="300" rx="14" fill="url(#bg)"/>
  <rect x="0.75" y="0.75" width="898.5" height="298.5" rx="13" fill="none" stroke="#4c1d95" stroke-width="1.5" opacity="0.55"/>
  <rect x="0" y="0" width="900" height="3" fill="#7c3aed" opacity="0.85"/>

  <text x="450" y="54" text-anchor="middle" class="mono kicker">DIGITAL STUDIO · EST. 2023 · INDONESIA</text>
  <text x="450" y="118" text-anchor="middle" class="sans name">FYNIXOR STUDIO</text>
  <text x="450" y="148" text-anchor="middle" class="mono sub">SINGLE-FOUNDER · BUILD · AUTOMATE · SHIP</text>
  <rect x="150" y="170" width="600" height="1.5" fill="url(#accent)"/>

  <!-- unit status row -->
  <g class="mono">
    <g transform="translate(60,200)">
      <rect width="180" height="64" rx="6" fill="#170f28" stroke="#4c1d95" stroke-width="1"/>
      <circle class="live" cx="20" cy="22" r="4.5" fill="#22c55e"/>
      <text x="34" y="26" class="unit">VORHEX STORE</text>
      <text x="20" y="48" class="state">ACTIVE</text>
    </g>
    <g transform="translate(260,200)">
      <rect width="180" height="64" rx="6" fill="#170f28" stroke="#4c1d95" stroke-width="1"/>
      <circle class="live" cx="20" cy="22" r="4.5" fill="#22c55e"/>
      <text x="34" y="26" class="unit">LUMINA WORKSITE</text>
      <text x="20" y="48" class="state">ACTIVE</text>
    </g>
    <g transform="translate(460,200)">
      <rect width="180" height="64" rx="6" fill="#170f28" stroke="#4c1d95" stroke-width="1"/>
      <circle cx="20" cy="22" r="4.5" fill="#a855f7"/>
      <text x="34" y="26" class="unit">VTUBER AGENCY</text>
      <text x="20" y="48" class="state">IN DEVELOPMENT</text>
    </g>
    <g transform="translate(660,200)">
      <rect width="180" height="64" rx="6" fill="#170f28" stroke="#4c1d95" stroke-width="1"/>
      <circle cx="20" cy="22" r="4.5" fill="#a855f7"/>
      <text x="34" y="26" class="unit">MBD</text>
      <text x="20" y="48" class="state">IN DEVELOPMENT</text>
    </g>
  </g>
</svg>
