<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400" role="img" aria-labelledby="heroTitle heroDesc">
<title id="heroTitle">Fynixor Studio banner</title>
<desc id="heroDesc">All languages, all tools, all platforms. Independent digital studio from Indonesia since 2023.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#07050f"/>
    <stop offset="0.45" stop-color="#1a1136"/>
    <stop offset="1" stop-color="#4c1d95"/>
  </linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#38bdf8"/>
    <stop offset="0.5" stop-color="#a78bfa"/>
    <stop offset="1" stop-color="#22c55e"/>
  </linearGradient>
  <radialGradient id="glow">
    <stop offset="0" stop-color="#a78bfa" stop-opacity="0.75"/>
    <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#c4b5fd" stroke-opacity="0.10" stroke-width="1"/>
  </pattern>
  <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
</defs>

<rect width="1600" height="400" fill="url(#bg)"/>
<rect width="1600" height="400" fill="url(#grid)"/>
<circle cx="1280" cy="180" r="230" fill="url(#glow)" filter="url(#soft)"/>
<circle cx="1300" cy="190" r="150" fill="none" stroke="#c4b5fd" stroke-opacity="0.22" stroke-width="2"/>
<circle cx="1300" cy="190" r="105" fill="none" stroke="#67e8f9" stroke-opacity="0.20" stroke-width="2"/>
<circle cx="1300" cy="190" r="60" fill="none" stroke="#86efac" stroke-opacity="0.25" stroke-width="2"/>

<g opacity="0.9">
  <path d="M1188 150 L1150 190 L1188 230" fill="none" stroke="#67e8f9" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1412 150 L1450 190 L1412 230" fill="none" stroke="#a78bfa" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M1265 110 L1335 270" fill="none" stroke="#86efac" stroke-width="7" stroke-linecap="round" transform="rotate(-18 1300 190)"/>
</g>
<g fill="#f8fafc">
  <circle cx="1150" cy="190" r="9" fill="#67e8f9"/>
  <circle cx="1450" cy="190" r="9" fill="#a78bfa"/>
  <circle cx="1300" cy="40" r="8" fill="#86efac"/>
  <circle cx="1300" cy="340" r="8" fill="#f0abfc"/>
  <circle cx="1195" cy="85" r="6" fill="#fde68a"/>
  <circle cx="1405" cy="295" r="6" fill="#f9a8d4"/>
</g>

<g transform="translate(70 100)">
  <rect width="170" height="170" rx="38" fill="#0b0714" stroke="url(#accent)" stroke-width="3"/>
  <text font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" x="85" y="105" text-anchor="middle" font-size="74" font-weight="800" fill="#f8fafc" letter-spacing="-3">FX</text>
  <text font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" x="85" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#a78bfa" letter-spacing="4">STUDIO</text>
</g>

<text font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" x="278" y="190" font-size="86" font-weight="800" fill="#f8fafc" letter-spacing="-2">FYnixor <tspan fill="#a78bfa">Studio</tspan></text>
<text font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" x="282" y="238" font-size="23" font-weight="600" fill="#c4b5fd" letter-spacing="3">ALL LANGUAGES · ALL TOOLS · ALL PLATFORMS</text>
<text font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" x="282" y="276" font-size="19" fill="#e2e8f0" opacity="0.85">Website · Mobile · Desktop · Bot · Automation · Freelance · Open source</text>

<g transform="translate(282 310)">
  <rect width="182" height="40" rx="20" fill="#0b0714" stroke="#38bdf8" stroke-opacity="0.55"/>
  <text font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" x="91" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#bae6fd" letter-spacing="1">SINCE 2023</text>
  <rect x="196" width="176" height="40" rx="20" fill="#0b0714" stroke="#a78bfa" stroke-opacity="0.55"/>
  <text font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" x="284" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#ddd6fe" letter-spacing="1">INDONESIA</text>
  <rect x="386" width="206" height="40" rx="20" fill="#0b0714" stroke="#22c55e" stroke-opacity="0.55"/>
  <text font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" x="489" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#bbf7d0" letter-spacing="1">1-PERSON STUDIO</text>
  <rect x="606" width="214" height="40" rx="20" fill="#0b0714" stroke="#f0abfc" stroke-opacity="0.55"/>
  <text font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" x="713" y="26" text-anchor="middle" font-size="15" font-weight="700" fill="#f5d0fe" letter-spacing="1">BUILT FROM SCRATCH</text>
</g>

<rect x="0" y="394" width="1600" height="6" fill="url(#accent)"/>
</svg>