<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-labelledby="title desc">
  <title id="title">Fynixor Studio logo</title>
  <desc id="desc">A purple F monogram on a dark rounded tile with a green spark and the word STUDIO.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#170d31"/>
      <stop offset="1" stop-color="#05030d"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="0.55" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="letter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f1fa"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect x="10" y="10" width="180" height="180" rx="44" fill="url(#bg)" stroke="url(#edge)" stroke-width="6"/>
  <rect x="24" y="24" width="152" height="152" rx="34" fill="none" stroke="#A78BFA" stroke-opacity="0.18" stroke-width="2"/>
  <path d="M64 56h80v20H86v26h50v20H86v46H64z" fill="url(#letter)" filter="url(#glow)"/>
  <path d="M150 132l4.5 13.5L168 150l-13.5 4.5L150 168l-4.5-13.5L132 150l13.5-4.5z" fill="#22C55E"/>
  <circle cx="150" cy="150" r="3" fill="#05030d"/>
  <text x="100" y="186" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="11" letter-spacing="3" fill="#A78BFA">STUDIO</text>
</svg>
