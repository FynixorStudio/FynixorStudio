<svg width="900" height="700" viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg">
<defs>
<style>
  .title { font-family: 'JetBrains Mono','Fira Code',ui-monospace,monospace; font-weight: 800; font-size: 26px; letter-spacing: 10px; fill: #ede9fe; }
  .kicker { font-family: 'JetBrains Mono','Fira Code',ui-monospace,monospace; font-weight: 600; font-size: 11px; letter-spacing: 4px; fill: #7c3aed; }
  .cat { font-family: 'JetBrains Mono','Fira Code',ui-monospace,monospace; font-weight: 700; font-size: 13px; letter-spacing: 3px; }
  .pill-text { font-family: 'JetBrains Mono','Fira Code',ui-monospace,monospace; font-weight: 600; font-size: 12px; letter-spacing: 1.4px; }
  .idx { font-family: 'JetBrains Mono',monospace; font-size: 11px; fill: #6d28d9; letter-spacing: 2px; }
  .chip { opacity: 0; animation: fadein .6s ease-out forwards; }
  @keyframes fadein { to { opacity: 1; } }
  @keyframes tickpulse { 0%, 100% { opacity: .9; } 50% { opacity: .35; } }
  .tick { animation: tickpulse 3.4s ease-in-out infinite; }
  @keyframes driftDust { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: .55; } 85% { opacity: .35; } 100% { transform: translateY(-620px); opacity: 0; } }
  .dust { animation: driftDust linear infinite; }
</style>

<linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#150c2c"/>
  <stop offset="55%" stop-color="#0a0618"/>
  <stop offset="100%" stop-color="#050308"/>
</linearGradient>

<linearGradient id="railGrad" x1="0%" y1="0%" x2="0%" y2="100%">
  <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0"/>
  <stop offset="15%" stop-color="#8b5cf6" stop-opacity="0.9"/>
  <stop offset="85%" stop-color="#6d28d9" stop-opacity="0.9"/>
  <stop offset="100%" stop-color="#6d28d9" stop-opacity="0"/>
</linearGradient>
</defs>

<rect x="0" y="0" width="900" height="700" rx="14" fill="url(#bg)"/>
<rect x="0.75" y="0.75" width="898.5" height="698.5" rx="13" fill="none" stroke="#4c1d95" stroke-width="1.5" opacity="0.55"/>

<rect x="0" y="30" width="3" height="640" fill="url(#railGrad)"/>
