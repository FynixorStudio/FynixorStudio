<g class="chip" style="animation-delay:0.60s"><rect x="496.8" y="254" width="108.2" height="32" rx="7" fill="#1b1330" stroke="#8b5cf6" stroke-width="1.2"/><text x="550.9" y="275" text-anchor="middle" class="pill-text" fill="#ddd6fe">REST API</text></g>

