<g class="chip" style="animation-delay:0.66s"><rect x="70.0" y="362" width="209.4" height="32" rx="7" fill="#170f28" stroke="#6d28d9" stroke-width="1.2"/><text x="174.7" y="383" text-anchor="middle" class="pill-text" fill="#a78bfa">PENETRATION TESTING</text></g>
