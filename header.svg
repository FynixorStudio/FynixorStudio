<svg xmlns="http://www.w3.org/2000/svg" width="900" height="110" viewBox="0 0 900 110" role="img" aria-label="Connect">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a0618"/>
      <stop offset="50%" stop-color="#150c2c"/>
      <stop offset="100%" stop-color="#0a0618"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6d28d9" stop-opacity="0"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0"/>
    </linearGradient>
    <style>
      .mono { font-family: 'JetBrains Mono','Fira Code',ui-monospace,Consolas,monospace; }
      @keyframes pulseline { 0%,100% { opacity: .45; } 50% { opacity: 1; } }
      .line { animation: pulseline 3.2s ease-in-out infinite; }
    </style>
  </defs>
  <rect width="900" height="110" fill="url(#bg)"/>
  <rect x="0.75" y="0.75" width="898.5" height="108.5" fill="none" stroke="#4c1d95" stroke-width="1.5" opacity="0.5"/>
  <text x="450" y="46" text-anchor="middle" class="mono" font-size="26" font-weight="700" letter-spacing="10" fill="#ede9fe">CONNECT</text>
  <text x="450" y="68" text-anchor="middle" class="mono" font-size="11" letter-spacing="3" fill="#7c3aed">// FIVERR · TELEGRAM · INSTAGRAM · EMAIL</text>
  <rect class="line" x="80" y="88" width="740" height="1.4" fill="url(#rule)"/>
</svg>
