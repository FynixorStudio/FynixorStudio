<svg xmlns="http://www.w3.org/2000/svg" width="900" height="120" viewBox="0 0 900 120" role="img" aria-label="Connect">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#0a0618"/>
      <stop offset="50%"  stop-color="#150c2c"/>
      <stop offset="100%" stop-color="#0a0618"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#6d28d9" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#8b5cf6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0"/>
    </linearGradient>
    <style>
      @keyframes pulseline { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
      .line { animation: pulseline 3.2s ease-in-out infinite; }
    </style>
  </defs>

  <rect x="0" y="0" width="900" height="120" fill="url(#bg)"/>
  <rect x="0.75" y="0.75" width="898.5" height="118.5" fill="none" stroke="#4c1d95" stroke-width="1.5" opacity="0.5"/>

  <text x="450" y="50" text-anchor="middle"
        font-family="'JetBrains Mono','Fira Code',ui-monospace,monospace"
        font-size="26" font-weight="700" letter-spacing="10" fill="#ede9fe">CONNECT</text>

  <text x="450" y="72" text-anchor="middle"
        font-family="'JetBrains Mono',ui-monospace,monospace"
        font-size="11" letter-spacing="3" fill="#7c3aed">
    // VORHEX STORE · VORPPOB · NEXUS SIGNAL
  </text>

  <path d="M420 62 L410 68 L420 74" fill="none" stroke="#6d28d9" stroke-width="1.4" opacity="0.7"/>
  <path d="M480 62 L490 68 L480 74" fill="none" stroke="#6d28d9" stroke-width="1.4" opacity="0.7"/>

  <rect class="line" x="80" y="92" width="740" height="1.4" fill="url(#rule)"/>
  <rect x="80" y="92" width="6" height="6" fill="#8b5cf6" transform="rotate(45 83 95)" opacity="0.85"/>
  <rect x="814" y="92" width="6" height="6" fill="#8b5cf6" transform="rotate(45 817 95)" opacity="0.85"/>
</svg>
